name: Dokka
on:
  push:
    branches: [mainline]

# Needed for peaceiris/actions-gh-pages to push to the gh-pages branch with the
# default GITHUB_TOKEN (repo token permissions default to read-only).
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # korogue consumes kotile as a sibling composite build (settings.gradle.kts).
      - name: Checkout kotile (sibling composite build)
        run: git clone --depth 1 https://github.com/ksletmoe/kotile.git ../kotile
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Build documentation
        run: ./gradlew :dokkaGenerateHtml --no-daemon --stacktrace
      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/dokka/html
